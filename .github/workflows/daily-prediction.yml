name: Daily Prediction

on:
  schedule:
    - cron: '30 14 * * 1-5'  # 6:30 AM PT = 14:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    # Job-level so the Telegram step's `if:` can see them (a step's own env is not visible to its `if:`)
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --upgrade yfinance edgartools requests pandas ccxt pycoingecko markdown weasyprint

      - name: Update dashboard data (runs first so data.json has fresh reddit for report fallback)
        run: python examples/update_dashboard.py

      - name: Generate prediction reports
        run: python examples/daily_prediction.py predictions/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/ docs/
          git commit -m "prediction: $(TZ=America/Los_Angeles date +%Y-%m-%d) daily report" || exit 0
          # Refresh Dashboard Data may have pushed meanwhile; on a data.json clash keep this run's snapshot
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done
          exit 1

      - name: Send to Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: python examples/send_telegram.py
