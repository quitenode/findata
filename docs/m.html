<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="findata">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>findata</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* iOS system palette; light mode follows the phone setting */
:root {
  --bg: #000; --surface: #1c1c1e; --surface2: #2c2c2e; --sep: rgba(84,84,88,.55);
  --text: #fff; --muted: rgba(235,235,245,.6); --faint: rgba(235,235,245,.3);
  --accent: #0a84ff; --green: #30d158; --red: #ff453a; --yellow: #ffd60a; --orange: #ff9f0a;
  --bar: rgba(22,22,24,.82);
  --rfs: 17px;
  --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f2f2f7; --surface: #fff; --surface2: #e5e5ea; --sep: rgba(60,60,67,.22);
    --text: #000; --muted: rgba(60,60,67,.66); --faint: rgba(60,60,67,.3);
    --accent: #007aff; --green: #248a3d; --red: #d70015; --yellow: #b25000; --orange: #c93400;
    --bar: rgba(249,249,251,.85);
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  padding-bottom: calc(64px + var(--sb));
  overscroll-behavior-y: none;
}
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--green); } .down { color: var(--red); } .flat { color: var(--muted); }

/* Top bar: compact title fades in once the large title scrolls away */
.topbar {
  position: sticky; top: 0; z-index: 20; padding: var(--st) 16px 0;
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid transparent; transition: border-color .2s;
}
.topbar.scrolled { border-bottom-color: var(--sep); }
.topbar-row { height: 44px; display: flex; align-items: center; gap: 8px; }
.topbar .brand { font-weight: 800; color: var(--accent); letter-spacing: -.3px; width: 84px; }
.topbar .ctitle { flex: 1; text-align: center; font-weight: 600; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar.scrolled .ctitle { opacity: 1; }
.topbar .actions { width: 84px; display: flex; justify-content: flex-end; gap: 4px; }
.icon-btn { min-width: 36px; height: 36px; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; color: var(--accent); font-size: 15px; font-weight: 600; padding: 0 8px; }
.icon-btn:active { background: var(--surface2); }
.icon-btn svg { width: 20px; height: 20px; }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.view { display: none; padding: 0 16px; }
.view.active { display: block; }
.large-title { font-size: 34px; font-weight: 800; letter-spacing: .3px; margin: 4px 0 2px; }
.subtitle { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 4px 8px; }
.section-h h2 { font-size: 22px; font-weight: 700; }
.section-h .more { font-size: 15px; }
.section-note { font-size: 13px; color: var(--muted); margin: -4px 4px 8px; }

.card { background: var(--surface); border-radius: 12px; overflow: hidden; }
.card + .card { margin-top: 12px; }
.pad { padding: 14px 16px; }
.empty { color: var(--muted); font-size: 15px; padding: 18px 16px; text-align: center; }

/* Index cards: horizontal swipe row */
.hscroll { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.idx { flex: 0 0 46%; scroll-snap-align: start; background: var(--surface); border-radius: 12px; padding: 12px; }
.idx .n { font-size: 13px; font-weight: 700; color: var(--muted); }
.idx .p { font-size: 20px; font-weight: 700; margin-top: 2px; }
.idx .c { font-size: 13px; font-weight: 600; }
.idx svg { display: block; width: 100%; height: 34px; margin-top: 6px; }

/* List rows, iOS Stocks style */
.row { display: flex; align-items: center; gap: 10px; padding: 11px 16px; min-height: 60px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.row.tap:active { background: var(--surface2); }
.row .l { flex: 1; min-width: 0; }
.row .t { font-weight: 700; font-size: 17px; }
.row .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r { text-align: right; flex-shrink: 0; }
.row .pr { font-size: 17px; font-weight: 600; }
.row svg.spark { flex-shrink: 0; }
.pill { display: inline-block; min-width: 76px; padding: 3px 8px; border-radius: 6px; font-size: 14px; font-weight: 700; text-align: right; color: #fff; margin-top: 3px; }
.pill.up { background: var(--green); color: #fff; } .pill.down { background: var(--red); color: #fff; } .pill.flat { background: var(--surface2); color: var(--text); }
@media (prefers-color-scheme: dark) { .pill.up, .pill.down { color: #000; } }

/* Sector bars (diverging) */
.sec { display: grid; grid-template-columns: 96px 1fr 62px; align-items: center; gap: 8px; padding: 7px 16px; font-size: 15px; }
.sec .bar { height: 10px; position: relative; background: var(--surface2); border-radius: 5px; }
.sec .bar i { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.sec .bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--faint); }
.sec .v { text-align: right; font-weight: 600; }

/* Fear & greed */
.mood { display: flex; align-items: center; gap: 14px; }
.mood svg { width: 128px; height: 74px; flex-shrink: 0; }
.mood .score { font-size: 34px; font-weight: 800; line-height: 1; }
.mood .rating { font-size: 17px; font-weight: 700; margin-top: 2px; }
.mood .hist { font-size: 13px; color: var(--muted); margin-top: 6px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 15px; border-top: .5px solid var(--sep); }
.kv:first-child { border-top: 0; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 600; text-align: right; }
details > summary { list-style: none; cursor: pointer; color: var(--accent); font-size: 15px; padding-top: 10px; }
details > summary::-webkit-details-marker { display: none; }
.meter { width: 70px; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
.meter i { display: block; height: 100%; border-radius: 3px; }

/* Signal badges */
.sig { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.sig.up { background: color-mix(in srgb, var(--green) 18%, transparent); }
.sig.down { background: color-mix(in srgb, var(--red) 18%, transparent); }
.sig.flat { background: var(--surface2); color: var(--muted); }

/* Outlook (from latest report) */
.outlook-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.outlook-head .big { font-size: 22px; font-weight: 800; }
.otbl { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
.otbl th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: left; padding: 4px 0; }
.otbl td { padding: 7px 0; border-top: .5px solid var(--sep); }
.otbl td.lv { font-size: 12px; color: var(--muted); padding-top: 0; border-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface2); border-radius: 15px; padding: 5px 11px; font-size: 14px; font-weight: 600; }
.chip small { color: var(--muted); font-weight: 500; margin-left: 3px; }
.chip.tap:active { opacity: .6; }

/* Segmented control */
.seg { display: inline-flex; background: var(--surface2); border-radius: 9px; padding: 2px; }
.seg button { padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--text); }
.seg button.on { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
@media (prefers-color-scheme: dark) { .seg button.on { background: #636366; } }

/* Report reader */
.rbar { position: sticky; top: calc(44px + var(--st)); z-index: 10; background: var(--bg); margin: 0 -16px; padding: 8px 16px; display: flex; align-items: center; gap: 8px; }
.datebtn { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; height: 34px; background: var(--surface); border-radius: 9px; font-weight: 600; font-size: 15px; }
.datebtn select { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; }
.navbtn { width: 34px; height: 34px; border-radius: 9px; background: var(--surface); color: var(--accent); font-size: 20px; display: inline-flex; align-items: center; justify-content: center; }
.navbtn:disabled { color: var(--faint); }
.report { font-size: var(--rfs); line-height: 1.6; padding: 4px 2px 20px; word-wrap: break-word; }
.report h1 { font-size: 1.45em; line-height: 1.25; margin: 6px 0 4px; }
.report h1 + p { font-size: .8em; color: var(--muted); }
.report h2 { font-size: 1.25em; margin: 1.6em 0 .5em; padding-top: .9em; border-top: .5px solid var(--sep); }
.report h3 { font-size: 1.02em; margin: 1.2em 0 .45em; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; font-size: .78em; }
.report p { margin: .55em 0; }
.report ul { padding-left: 1.15em; margin: .5em 0; }
.report li { margin: .35em 0; }
.report strong { font-weight: 700; }
.report code { font: 600 .72em -apple-system, sans-serif; background: var(--surface2); color: var(--muted); padding: 2px 6px; border-radius: 6px; white-space: nowrap; vertical-align: 1px; }
.report hr { border: 0; border-top: .5px solid var(--sep); margin: 1.6em 0 .8em; }
.report em { color: var(--muted); font-size: .85em; }
.tbl-wrap { overflow-x: auto; margin: .6em -16px; padding: 0 16px; -webkit-overflow-scrolling: touch; }
.tbl-wrap table { border-collapse: separate; border-spacing: 0; font-size: 14px; line-height: 1.3; background: var(--surface); border-radius: 10px; min-width: 100%; }
.tbl-wrap th, .tbl-wrap td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: .5px solid var(--sep); }
.tbl-wrap tr:last-child td { border-bottom: 0; }
.tbl-wrap th { font-size: 12px; color: var(--muted); font-weight: 600; }
.tbl-wrap th:first-child, .tbl-wrap td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); font-weight: 700; z-index: 1; box-shadow: .5px 0 0 var(--sep); }
.tbl-wrap .num-up { color: var(--green); } .tbl-wrap .num-down { color: var(--red); }
.tbl-hint { font-size: 12px; color: var(--muted); margin: -2px 2px 4px; }

/* Stocks */
.search { position: sticky; top: calc(44px + var(--st)); z-index: 10; background: var(--bg); margin: 0 -16px; padding: 6px 16px 8px; }
.search input { width: 100%; height: 38px; border-radius: 10px; border: 0; background: var(--surface2); color: var(--text); font-size: 17px; padding: 0 12px 0 34px; outline: none; -webkit-appearance: none; }
.search .glass { position: absolute; left: 28px; top: 16px; width: 18px; height: 18px; color: var(--muted); }
.search .seg { margin-top: 8px; display: flex; }
.search .seg button { flex: 1; }
.loadmore { display: block; width: 100%; padding: 14px; color: var(--accent); font-size: 17px; border-top: .5px solid var(--sep); }

/* Reddit */
.post { display: block; padding: 12px 16px; color: var(--text); position: relative; }
.post + .post::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.post:active { background: var(--surface2); }
.post .pt { font-size: 16px; line-height: 1.35; }
.post .pm { font-size: 13px; color: var(--muted); margin-top: 4px; }
.post .flair { background: var(--surface2); border-radius: 5px; padding: 1px 6px; margin-left: 6px; font-size: 12px; }

/* Indicator rows */
.ind { display: flex; align-items: center; gap: 10px; padding: 11px 16px; position: relative; color: var(--text); }
.ind + .ind::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.ind .dot { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: var(--faint); }
.ind .dot.up { background: var(--green); } .ind .dot.down { background: var(--red); }
.ind .nm { flex: 1; font-size: 15px; }
.ind .vl { font-size: 15px; font-weight: 600; text-align: right; max-width: 52%; }
.ind .chev { color: var(--faint); font-size: 15px; }
.tally { display: flex; gap: 8px; margin-top: 10px; }
.tally div { flex: 1; text-align: center; background: var(--surface2); border-radius: 10px; padding: 8px 4px; }
.tally b { display: block; font-size: 22px; }
.tally span { font-size: 12px; color: var(--muted); }

/* Detail sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet-bg.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--st) + 10px); z-index: 41;
  background: var(--bg); border-radius: 14px 14px 0 0; transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  display: flex; flex-direction: column;
}
.sheet.open { transform: none; }
.sheet .grab { padding: 8px 16px 4px; display: flex; align-items: center; justify-content: space-between; touch-action: none; }
.sheet .grab::before { content: ""; position: absolute; left: 50%; top: 6px; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--faint); }
.sheet .body { flex: 1; overflow-y: auto; padding: 0 16px calc(24px + var(--sb)); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.d-head .tk { font-size: 28px; font-weight: 800; }
.d-head .nm { font-size: 15px; color: var(--muted); }
.d-price { font-size: 34px; font-weight: 700; margin-top: 8px; }
.d-chg { font-size: 17px; font-weight: 600; }
.d-readout { font-size: 13px; color: var(--muted); height: 18px; margin-top: 2px; }
.chart { margin: 8px 0 4px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; }
.chart-axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.grid2 .kv:nth-child(2) { border-top: 0; }
.range { height: 6px; background: var(--surface2); border-radius: 3px; position: relative; margin: 8px 0 4px; }
.range i { position: absolute; top: -4px; width: 14px; height: 14px; border-radius: 7px; background: var(--text); margin-left: -7px; border: 2px solid var(--surface); }
.range-l { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.ext { display: flex; gap: 10px; margin-top: 16px; }
.ext a { flex: 1; text-align: center; background: var(--surface); border-radius: 10px; padding: 11px; font-size: 15px; font-weight: 600; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex;
  padding-bottom: var(--sb); background: var(--bar); border-top: .5px solid var(--sep);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
}
.tabbar button { flex: 1; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; color: var(--muted); }
.tabbar button svg { width: 25px; height: 25px; }
.tabbar button.on { color: var(--accent); }
.foot { text-align: center; font-size: 13px; color: var(--muted); padding: 28px 0 8px; }
.foot a { margin: 0 6px; }
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="topbar-row">
    <div class="brand">findata</div>
    <div class="ctitle" id="ctitle"></div>
    <div class="actions">
      <button class="icon-btn" id="langBtn" aria-label="Language">中</button>
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </div>
  </div>
</header>

<main>
  <section class="view" id="v-today">
    <h1 class="large-title" data-i="Today"></h1>
    <div class="subtitle" id="updated"></div>
    <div class="hscroll" id="indices"></div>
    <div id="outlook"></div>
    <div class="section-h"><h2 data-i="Market Mood"></h2></div>
    <div class="card pad" id="mood"></div>
    <div class="section-h"><h2 data-i="Mega-Caps"></h2></div>
    <div class="card" id="mega"></div>
    <div class="section-h"><h2 data-i="Commodities & Rates"></h2></div>
    <div class="card" id="cmdty"></div>
    <div class="section-h"><h2 data-i="Sectors"></h2><span class="section-note" data-i="5-day return"></span></div>
    <div class="card" id="sectors" style="padding:6px 0"></div>
    <div class="foot"><span data-i="Not financial advice."></span><br><a href="index.html" id="desktopLink" data-i="Desktop site"></a></div>
  </section>

  <section class="view" id="v-report">
    <h1 class="large-title" data-i="Daily Report"></h1>
    <div class="rbar">
      <button class="navbtn" id="rOlder" aria-label="Older">&#8249;</button>
      <label class="datebtn"><span id="rDateLabel"></span><select id="rDate"></select></label>
      <button class="navbtn" id="rNewer" aria-label="Newer">&#8250;</button>
      <button class="navbtn" id="rSize" aria-label="Text size" style="font-size:15px;font-weight:700">Aa</button>
    </div>
    <article class="report" id="reportBody"></article>
  </section>

  <section class="view" id="v-stocks">
    <h1 class="large-title" data-i="Stocks"></h1>
    <div class="search">
      <svg class="glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
      <div class="seg" id="sortSeg">
        <button data-s="cap" class="on" data-i="Market Cap"></button>
        <button data-s="gain" data-i="Gainers"></button>
        <button data-s="loss" data-i="Losers"></button>
      </div>
    </div>
    <div class="card" id="stockList"></div>
  </section>

  <section class="view" id="v-crypto">
    <h1 class="large-title" data-i="Crypto"></h1>
    <div class="card" id="coins" style="margin-top:12px"></div>
    <div class="section-h"><h2 data-i="BTC On-Chain"></h2></div>
    <div class="card pad" id="btcTally"></div>
    <div class="card" id="btcInd" style="margin-top:12px"></div>
  </section>

  <section class="view" id="v-buzz">
    <h1 class="large-title" data-i="Reddit Buzz"></h1>
    <div class="section-h" style="margin-top:12px"><h2 data-i="Most Mentioned"></h2></div>
    <div class="chips" id="mentions"></div>
    <div id="subs"></div>
  </section>
</main>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab" id="grab"><span></span><button class="icon-btn" id="sheetClose" data-i="Done"></button></div>
  <div class="body" id="sheetBody"></div>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg><span data-i="Today"></span></button>
  <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg><span data-i="Report"></span></button>
  <button data-tab="stocks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i="Stocks"></span></button>
  <button data-tab="crypto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 7.5h4a2.2 2.2 0 0 1 0 4.5h-4zm0 4.5h4.5a2.2 2.2 0 0 1 0 4.5H9.5zM9.5 7.5v9M11 6v1.5M11 16.5V18"/></svg><span data-i="Crypto"></span></button>
  <button data-tab="buzz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-i="Buzz"></span></button>
</nav>

<script>
// ---- i18n (shares findata_lang with the desktop dashboard) ----
let LANG = localStorage.getItem('findata_lang') || 'en';
const I18N = {
  'Today': '今日', 'Report': '报告', 'Stocks': '股票', 'Crypto': '加密', 'Buzz': '热议',
  'Daily Report': '每日报告', 'Market Mood': '市场情绪', 'Mega-Caps': '科技巨头',
  'Commodities & Rates': '大宗商品与利率', 'Sectors': '板块', '5-day return': '5日回报',
  'Updated': '更新于', 'Not financial advice.': '不构成投资建议。', 'Desktop site': '桌面版',
  'Outlook': '展望', 'Tomorrow': '明日', 'Next Week': '下周', 'Read report': '阅读报告',
  'Fear & Greed': '恐惧与贪婪', 'Prev close': '前收', '1W ago': '1周前', '1M ago': '1月前',
  'Components': '分项指标', 'Market breadth': '市场广度', 'above SMA50': '高于50日均线',
  'Search ticker or company': '搜索代码或公司', 'Market Cap': '市值', 'Gainers': '涨幅', 'Losers': '跌幅',
  'Show more': '显示更多', 'No matches': '无匹配结果', 'Done': '完成',
  'P/E': '市盈率', 'Fwd P/E': '远期市盈率', 'EPS': '每股收益', 'Div Yield': '股息率',
  '52-week range': '52周区间', 'Technicals': '技术指标', 'Analysts': '分析师',
  'Target': '目标价', 'Upside': '上涨空间', 'analysts': '位分析师',
  'Volatility (ann.)': '年化波动率', 'Volume vs avg': '成交量/均量', '3M high': '3月高点', '3M low': '3月低点',
  'Bollinger': '布林带', 'Overall': '综合',
  'BTC On-Chain': 'BTC 链上指标', 'Bullish': '看涨', 'Bearish': '看跌', 'Neutral': '中性',
  'Reddit Buzz': 'Reddit 热议', 'Most Mentioned': '提及最多', 'comments': '评论',
  'Report not available': '报告暂不可用', 'Could not load data': '无法加载数据',
  'Swipe tables sideways': '表格可左右滑动', '1 month': '1个月', '30 days': '30天',
  'Buy': '买入', 'Sell': '卖出', 'Strong Buy': '强力买入', 'Strong Sell': '强力卖出', 'Hold': '持有',
  'Low': '最低', 'High': '最高', 'Sector': '板块',
  // data labels
  'Healthcare': '医疗', 'Materials': '原材料', 'Utilities': '公用事业', 'Industrial': '工业', 'RealEstate': '房地产',
  'Staples': '必需消费', 'Finance': '金融', 'Energy': '能源', 'Tech': '科技', 'Comm': '通信', 'Discretionary': '可选消费',
  'WTI Crude': 'WTI 原油', 'Gold': '黄金', 'Silver': '白银', '10Y Yield': '10年期美债', 'US Dollar Index': '美元指数',
  'RUSS 2K': '罗素2000', 'DJIA': '道琼斯', 'NASDAQ': '纳斯达克', 'S&P 500': '标普500',
};
const t = k => (LANG === 'cn' && I18N[k]) || k;

// ---- formatting ----
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok = n => typeof n === 'number' && isFinite(n);
const dir = n => !ok(n) || n === 0 ? 'flat' : (n > 0 ? 'up' : 'down');
const fNum = (n, d = 2) => ok(n) ? n.toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d}) : '—';
const fUsd = n => ok(n) ? '$' + fNum(n, Math.abs(n) >= 1 ? 2 : 4) : '—';
const fCap = n => !ok(n) ? '—' : n >= 1e12 ? `$${(n/1e12).toFixed(2)}T` : n >= 1e9 ? `$${(n/1e9).toFixed(1)}B` : `$${(n/1e6).toFixed(0)}M`;
const fPct = n => ok(n) ? `${n > 0 ? '+' : ''}${n.toFixed(2)}%` : '—';
const fPts = n => ok(n) ? `${n > 0 ? '+' : ''}${fNum(n)}` : '';
const fCoin = n => !ok(n) ? '—' : n >= 1000 ? '$' + fNum(n, 0) : fUsd(n);
function fCmdty(c) {
  if ((c.name || '').includes('Yield')) return ok(c.price) ? c.price.toFixed(3) + '%' : '—';
  if ((c.name || '').includes('Dollar')) return fNum(c.price, 2);
  return fUsd(c.price);
}
// Signal words in English and Chinese -> up/down/flat
const sigDir = s => /bull|看涨|偏多|buy|买入/i.test(s) ? 'up' : /bear|看跌|偏空|sell|卖出/i.test(s) ? 'down' : 'flat';
const sigBadge = s => s ? `<span class="sig ${sigDir(s)}">${esc(t(String(s).replace(/_/g, ' ').replace(/\b[a-z]/g, c => c.toUpperCase())))}</span>` : '';

function spark(vals, w = 64, h = 30) {
  const v = (vals || []).filter(ok);
  if (v.length < 2) return '';
  const mn = Math.min(...v), mx = Math.max(...v), r = mx - mn || 1;
  const pts = v.map((x, i) => `${(i / (v.length - 1) * w).toFixed(1)},${(h - 2 - (x - mn) / r * (h - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark ${dir(v[v.length - 1] - v[0])}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

// ---- data ----
let DATA = null;
let STOCKS = new Map();
let reportCache = {};

/** Python's json encoder can emit NaN/Infinity; JSON.parse rejects them. */
function parseJson(text) {
  try { return JSON.parse(text); }
  catch (e) { return JSON.parse(text.replace(/(?<=[\[,:\s])-?(NaN|Infinity)(?=[\],}\s])/g, 'null')); }
}
const arr = x => Array.isArray(x) ? x : [];

async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');
  try {
    const r = await fetch('data.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = parseJson(await r.text()) || {};
    DATA = {
      generated: d.generated || '', indices: arr(d.indices), megacaps: arr(d.megacaps), all_stocks: arr(d.all_stocks),
      sectors: arr(d.sectors), commodities: arr(d.commodities), crypto: arr(d.crypto), crypto_indicators: arr(d.crypto_indicators),
      reddit: arr(d.reddit), reports: arr(d.reports).filter(x => x && x.date).sort((a, b) => b.date.localeCompare(a.date)),
      fear_greed: d.fear_greed && typeof d.fear_greed === 'object' ? d.fear_greed : null,
    };
    STOCKS = new Map(DATA.all_stocks.map(s => [s.ticker, s]));
    DATA.megacaps.forEach(m => STOCKS.set(m.ticker, { ...STOCKS.get(m.ticker), ...m }));
    loadedAt = Date.now();
    renderAll();
  } catch (e) {
    document.getElementById('updated').textContent = `${t('Could not load data')} (${e.message})`;
  } finally {
    btn.classList.remove('spin');
  }
}

function renderAll() {
  applyStatic();
  renderToday(); renderStocks(); renderCrypto(); renderBuzz(); renderReportPicker();
  if (current === 'report') loadReport();
}

function applyStatic() {
  document.documentElement.lang = LANG === 'cn' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  document.getElementById('q').placeholder = t('Search ticker or company');
  document.getElementById('langBtn').textContent = LANG === 'cn' ? 'EN' : '中';
  document.getElementById('ctitle').textContent = t(TAB_TITLES[current] || '');
}

// ---- Today ----
function renderToday() {
  document.getElementById('updated').textContent = DATA.generated ? `${t('Updated')} ${DATA.generated}` : '';

  document.getElementById('indices').innerHTML = DATA.indices.map(i => {
    const isVix = (i.name || '').includes('VIX');
    return `<div class="idx"><div class="n">${esc(t(i.name || i.ticker))}</div>
      <div class="p num">${fNum(i.price)}</div>
      <div class="c num ${dir(i.change_pct)}">${isVix ? '' : fPts(i.change_pts) + ' '}${fPct(i.change_pct)}</div>
      ${spark(i.history, 120, 34)}</div>`;
  }).join('') || `<div class="empty">—</div>`;

  renderMood();

  document.getElementById('mega').innerHTML = DATA.megacaps.map(stockRow).join('') || `<div class="empty">—</div>`;

  document.getElementById('cmdty').innerHTML = DATA.commodities.map(c => `
    <div class="row"><div class="l"><div class="t" style="font-size:16px">${esc(t(c.name))}</div><div class="s num">5D ${fPct(c.ret_5d)}</div></div>
      ${spark(c.history)}
      <div class="r"><div class="pr num">${fCmdty(c)}</div><div class="num ${dir(c.change_pct)}" style="font-size:14px;font-weight:600">${fPct(c.change_pct)}</div></div></div>`).join('') || `<div class="empty">—</div>`;

  const mx = Math.max(1, ...DATA.sectors.map(s => Math.abs(s.ret_5d || 0)));
  document.getElementById('sectors').innerHTML = [...DATA.sectors].sort((a, b) => (b.ret_5d || 0) - (a.ret_5d || 0)).map(s => {
    const v = s.ret_5d || 0, w = Math.abs(v) / mx * 50;
    const pos = v >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%`;
    return `<div class="sec"><span>${esc(t(s.name))}</span><div class="bar"><i style="${pos};background:var(--${v >= 0 ? 'green' : 'red'})"></i></div><span class="v num ${dir(v)}">${fPct(v)}</span></div>`;
  }).join('') || `<div class="empty">—</div>`;

  renderOutlook();
}

function gauge(score) {
  // Semicircle: red (0) -> green (100), needle at score
  const seg = (a0, a1, col) => {
    const p = a => [64 - 54 * Math.cos(a), 66 - 54 * Math.sin(a)].map(n => n.toFixed(1)).join(' ');
    return `<path d="M${p(a0)} A54 54 0 0 1 ${p(a1)}" stroke="${col}" stroke-width="11" fill="none"/>`;
  };
  const cols = ['var(--red)', 'var(--orange)', 'var(--yellow)', '#8fd14f', 'var(--green)'];
  const arcs = cols.map((c, i) => seg(Math.PI * i / 5 + .03, Math.PI * (i + 1) / 5 - .03, c)).join('');
  const a = Math.PI * Math.min(100, Math.max(0, score)) / 100;
  const nx = 64 - 44 * Math.cos(a), ny = 66 - 44 * Math.sin(a);
  return `<svg viewBox="0 0 128 74">${arcs}<line x1="64" y1="66" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/><circle cx="64" cy="66" r="5" fill="var(--text)"/></svg>`;
}
const fgDir = s => s <= 45 ? 'down' : s >= 55 ? 'up' : 'flat';

function renderMood() {
  const fg = DATA.fear_greed;
  let html = '';
  if (fg && ok(fg.score)) {
    const hist = [['Prev close', fg.previous_close], ['1W ago', fg.previous_1_week], ['1M ago', fg.previous_1_month]]
      .filter(([, v]) => ok(v)).map(([k, v]) => `${t(k)} ${Math.round(v)}`).join(' · ');
    const comps = arr(fg.components).map(c => `<div class="kv"><span class="k">${esc(c.name)}</span><span class="v"><span class="meter"><i style="width:${c.score}%;background:var(--${fgDir(c.score) === 'up' ? 'green' : fgDir(c.score) === 'down' ? 'red' : 'yellow'})"></i></span><span class="num">${c.score}</span></span></div>`).join('');
    html += `<div class="mood">${gauge(fg.score)}<div><div class="score num ${fgDir(fg.score)}">${fg.score}</div>
      <div class="rating ${fgDir(fg.score)}">${esc(fg.rating || '')}</div><div class="hist">${t('Fear & Greed')} · CNN</div></div></div>
      ${hist ? `<div class="hist" style="font-size:13px;color:var(--muted);margin-top:8px">${hist}</div>` : ''}
      ${comps ? `<details><summary>${t('Components')}</summary><div style="margin-top:6px">${comps}</div></details>` : ''}`;
  }
  const withTech = DATA.all_stocks.filter(s => s.technicals);
  if (withTech.length > 10) {
    const above = withTech.filter(s => s.technicals.sma50?.signal === 'bullish').length;
    const pct = Math.round(above / withTech.length * 100);
    html += `<div class="kv" style="margin-top:10px;border-top:.5px solid var(--sep)"><span class="k">${t('Market breadth')}</span><span class="v num ${pct > 60 ? 'up' : pct < 40 ? 'down' : ''}">${pct}% ${t('above SMA50')}</span></div>`;
  }
  const vix = DATA.indices.find(i => (i.name || '').includes('VIX'));
  if (vix && ok(vix.price)) {
    html += `<div class="kv"><span class="k">VIX</span><span class="v num ${vix.price >= 20 ? 'down' : 'up'}">${vix.price.toFixed(2)} <span style="color:var(--muted);font-weight:500">${fPts(vix.change_pts)}</span></span></div>`;
  }
  document.getElementById('mood').innerHTML = html || `<div class="empty">—</div>`;
}

/** Pull the "Prediction Summary" section out of the newest report for the Today tab. */
function parseOutlook(md) {
  const m = md.match(/^## (?:Prediction Summary|预测总结)\s*$([\s\S]*?)(?=^## |^---|$(?![\s\S]))/m);
  if (!m) return null;
  const sec = m[1];
  const overall = (sec.match(/\*\*[^*:：]+[:：]\s*([^*]+)\*\*/) || [])[1];
  const rows = sec.split('\n').filter(l => /^\|/.test(l) && !/^\|\s*-/.test(l)).slice(1)
    .map(l => l.split('|').slice(1, -1).map(c => c.trim()));
  const factors = [...sec.matchAll(/^- \*\*(.+?)\*\*/gm)].map(x => x[1]);
  return { overall, rows, factors };
}

async function renderOutlook() {
  const el = document.getElementById('outlook');
  const latest = DATA.reports[0];
  if (!latest) { el.innerHTML = ''; return; }
  const md = await fetchReport(latest.date, LANG);
  const o = md && parseOutlook(md);
  if (!o || !o.overall) { el.innerHTML = ''; return; }
  const rows = o.rows.map(r => `<tr><td style="font-weight:600">${esc(r[0])}</td><td>${sigBadge(r[1])}</td><td>${sigBadge(r[2])}</td></tr>
    ${r[3] ? `<tr><td class="lv" colspan="3">${esc(r[3])}</td></tr>` : ''}`).join('');
  el.innerHTML = `<div class="section-h"><h2>${t('Outlook')}</h2><a class="more" href="#report/${latest.date}">${t('Read report')} ›</a></div>
    <div class="card pad">
      <div class="outlook-head"><span class="subtitle" style="margin:0">${esc(latest.date)}</span><span class="big ${sigDir(o.overall)}">${esc(o.overall)}</span></div>
      ${rows ? `<table class="otbl"><tr><th></th><th>${t('Tomorrow')}</th><th>${t('Next Week')}</th></tr>${rows}</table>` : ''}
      ${o.factors.length ? `<div class="chips" style="margin-top:10px">${o.factors.map(f => `<span class="chip">${esc(f)}</span>`).join('')}</div>` : ''}
    </div>`;
}

// ---- Stocks ----
function stockRow(s) {
  return `<div class="row tap" data-stock="${esc(s.ticker)}"><div class="l"><div class="t">${esc(s.ticker)}</div><div class="s">${esc(s.name || '')}</div></div>
    ${spark(s.history)}
    <div class="r"><div class="pr num">${fUsd(s.price)}</div><span class="pill num ${dir(s.change_pct)}">${fPct(s.change_pct)}</span></div></div>`;
}

let sortMode = 'cap', listLimit = 40;
function renderStocks() {
  const q = document.getElementById('q').value.trim().toUpperCase();
  let list = [...STOCKS.values()].filter(s => ok(s.price));
  if (q) {
    list = list.filter(s => s.ticker.startsWith(q) || (s.name || '').toUpperCase().includes(q));
    list.sort((a, b) => (b.ticker === q) - (a.ticker === q) || (b.ticker.startsWith(q)) - (a.ticker.startsWith(q)) || (b.market_cap || 0) - (a.market_cap || 0));
  } else if (sortMode === 'gain') list.sort((a, b) => (b.change_pct ?? -1e9) - (a.change_pct ?? -1e9));
  else if (sortMode === 'loss') list.sort((a, b) => (a.change_pct ?? 1e9) - (b.change_pct ?? 1e9));
  else list.sort((a, b) => (b.market_cap || 0) - (a.market_cap || 0));
  const shown = list.slice(0, listLimit);
  document.getElementById('stockList').innerHTML = shown.length
    ? shown.map(stockRow).join('') + (list.length > listLimit ? `<button class="loadmore" id="more">${t('Show more')} (${list.length - listLimit})</button>` : '')
    : `<div class="empty">${t('No matches')}</div>`;
}

function techRows(tech) {
  const L = [];
  const add = (k, v, s) => L.push(`<div class="kv"><span class="k">${k}</span><span class="v num">${v} ${sigBadge(s)}</span></div>`);
  if (tech.rsi && ok(tech.rsi.value)) add('RSI (14)', tech.rsi.value.toFixed(1), tech.rsi.signal);
  if (tech.macd && ok(tech.macd.value)) add('MACD', tech.macd.value.toFixed(2), tech.macd.signal);
  for (const k of ['sma20', 'sma50', 'sma200']) if (tech[k] && ok(tech[k].value)) add(k.toUpperCase(), fUsd(tech[k].value), tech[k].signal);
  if (tech.bollinger && ok(tech.bollinger.lower)) add(t('Bollinger'), `${fNum(tech.bollinger.lower)} – ${fNum(tech.bollinger.upper)}`, tech.bollinger.signal);
  if (tech.volatility && ok(tech.volatility.value)) add(t('Volatility (ann.)'), tech.volatility.value.toFixed(1) + '%', '');
  if (tech.volume_ratio && ok(tech.volume_ratio.value)) add(t('Volume vs avg'), tech.volume_ratio.value.toFixed(2) + '×', tech.volume_ratio.signal);
  if (tech.high_3m && ok(tech.high_3m.value)) add(t('3M high'), fUsd(tech.high_3m.value), '');
  if (tech.low_3m && ok(tech.low_3m.value)) add(t('3M low'), fUsd(tech.low_3m.value), '');
  return L.join('');
}

function stockDetail(s) {
  const kv = (k, v) => `<div class="kv"><span class="k">${k}</span><span class="v num">${v}</span></div>`;
  const stats = [
    kv(t('Market Cap'), fCap(s.market_cap)), kv(t('P/E'), ok(s.pe) ? s.pe.toFixed(1) : '—'),
    kv(t('Fwd P/E'), ok(s.forward_pe) ? s.forward_pe.toFixed(1) : '—'), kv(t('EPS'), ok(s.eps) ? fUsd(s.eps) : '—'),
    kv(t('Div Yield'), ok(s.dividend_yield) ? s.dividend_yield.toFixed(2) + '%' : '—'), kv(t('Sector'), esc(s.sector || '—')),
  ].join('');
  const lo = s['52w_low'], hi = s['52w_high'];
  const range = ok(lo) && ok(hi) && hi > lo ? `<div style="margin-top:14px;font-size:13px;color:var(--muted)">${t('52-week range')}</div>
    <div class="range"><i style="left:${Math.min(100, Math.max(0, (s.price - lo) / (hi - lo) * 100))}%"></i></div>
    <div class="range-l num"><span>${fUsd(lo)}</span><span>${fUsd(hi)}</span></div>` : '';
  const tech = s.technicals ? `<div class="section-h"><h2>${t('Technicals')}</h2>${sigBadge(s.technicals.overall?.label)}</div><div class="card pad">${techRows(s.technicals)}</div>` : '';
  const an = s.analyst;
  const analyst = an && ok(an.target_mean) ? `<div class="section-h"><h2>${t('Analysts')}</h2>${sigBadge(an.recommendation)}</div><div class="card pad">
      ${kv(t('Target'), `${fUsd(an.target_mean)} <span class="${dir(an.target_mean - s.price)}">(${fPct((an.target_mean / s.price - 1) * 100)})</span>`)}
      ${kv(`${t('Low')} / ${t('High')}`, `${fUsd(an.target_low)} / ${fUsd(an.target_high)}`)}
      ${ok(an.num_analysts) ? kv('#', `${an.num_analysts} ${t('analysts')}`) : ''}</div>` : '';
  const sym = encodeURIComponent(s.ticker);
  return `<div class="d-head"><div class="tk">${esc(s.ticker)}</div><div class="nm">${esc(s.name || '')}${s.industry ? ' · ' + esc(s.industry) : ''}</div></div>
    <div class="d-price num">${fUsd(s.price)}</div>
    <div class="d-chg num ${dir(s.change_pct)}">${fPct(s.change_pct)}</div>
    ${chartBlock(s.history, s.dates, fUsd, t('1 month'))}
    <div class="card pad" style="margin-top:12px"><div class="grid2">${stats}</div>${range}</div>
    ${tech}${analyst}
    <div class="ext"><a href="https://finance.yahoo.com/quote/${sym}" target="_blank" rel="noopener">Yahoo Finance ↗</a><a href="https://www.tradingview.com/symbols/${sym}/" target="_blank" rel="noopener">TradingView ↗</a></div>`;
}

// Area chart with touch scrubbing; wired up by attachChart() after insertion
function chartBlock(vals, dates, fmt, label) {
  CHART = null;
  if (arr(vals).filter(ok).length < 2) return '';
  const d = arr(dates);
  CHART = { vals, dates: d, fmt };
  return `<div class="d-readout num" id="readout">${esc(label)}</div><div class="chart" id="chart"></div>
    <div class="chart-axis num"><span>${esc(d[0] || '')}</span><span>${esc(d[d.length - 1] || '')}</span></div>`;
}
let CHART = null;
function attachChart() {
  const el = document.getElementById('chart');
  if (!el || !CHART) return;
  const { vals, dates, fmt } = CHART;
  const W = el.clientWidth, H = 170, pad = 8;
  const v = vals.map(x => ok(x) ? x : null);
  const good = v.filter(ok), mn = Math.min(...good), mx = Math.max(...good), r = mx - mn || 1;
  const X = i => i / (v.length - 1) * W, Y = x => pad + (1 - (x - mn) / r) * (H - 2 * pad);
  const pts = v.map((x, i) => ok(x) ? [X(i), Y(x)] : null).filter(Boolean);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  const cls = dir(good[good.length - 1] - good[0]);
  el.innerHTML = `<svg class="${cls}" viewBox="0 0 ${W} ${H}" height="${H}">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".28"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${Y(good[0]).toFixed(1)}" y2="${Y(good[0]).toFixed(1)}" stroke="var(--faint)" stroke-dasharray="2 4"/>
    <polygon points="0,${H} ${line} ${W},${H}" fill="url(#g)"/>
    <polyline points="${line}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <line id="cx" y1="0" y2="${H}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
    <circle id="cd" r="5" fill="currentColor" stroke="var(--bg)" stroke-width="2" visibility="hidden"/></svg>`;
  const svg = el.firstElementChild, cx = svg.querySelector('#cx'), cd = svg.querySelector('#cd');
  const ro = document.getElementById('readout'), base = ro.textContent;
  const show = e => {
    const rect = svg.getBoundingClientRect();
    const i = Math.round(Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)) * (v.length - 1));
    if (!ok(v[i])) return;
    cx.setAttribute('x1', X(i)); cx.setAttribute('x2', X(i)); cd.setAttribute('cx', X(i)); cd.setAttribute('cy', Y(v[i]));
    cx.setAttribute('visibility', 'visible'); cd.setAttribute('visibility', 'visible');
    ro.innerHTML = `${esc(dates[i] || '')} · <b style="color:var(--text)">${fmt(v[i])}</b> <span class="${dir(v[i] - good[0])}">${fPct((v[i] / good[0] - 1) * 100)}</span>`;
  };
  const hide = () => { cx.setAttribute('visibility', 'hidden'); cd.setAttribute('visibility', 'hidden'); ro.textContent = base; };
  svg.addEventListener('pointerdown', show); svg.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'mouse') show(e); });
  svg.addEventListener('pointerup', hide); svg.addEventListener('pointerleave', hide); svg.addEventListener('pointercancel', hide);
}

// ---- Crypto ----
function renderCrypto() {
  document.getElementById('coins').innerHTML = DATA.crypto.map(c => `
    <div class="row tap" data-coin="${esc(c.id)}"><div class="l"><div class="t">${esc(c.symbol)}</div><div class="s num">7D ${fPct(c.change_7d)} · ${fCap(c.market_cap)}</div></div>
      ${spark(c.history)}
      <div class="r"><div class="pr num">${fCoin(c.price)}</div><span class="pill num ${dir(c.change_24h)}">${fPct(c.change_24h)}</span></div></div>`).join('') || `<div class="empty">—</div>`;

  const ind = DATA.crypto_indicators;
  const n = d => ind.filter(i => sigDir(i.signal || '') === d && i.signal).length;
  const bull = n('up'), bear = n('down'), neu = ind.filter(i => i.signal && sigDir(i.signal) === 'flat').length;
  document.getElementById('btcTally').innerHTML = ind.length ? `<div class="subtitle" style="margin:0">${esc(ind[0].date || '')}</div>
    <div class="tally"><div><b class="up">${bull}</b><span>${t('Bullish')}</span></div><div><b>${neu}</b><span>${t('Neutral')}</span></div><div><b class="down">${bear}</b><span>${t('Bearish')}</span></div></div>` : `<div class="empty">—</div>`;
  document.getElementById('btcInd').innerHTML = ind.map(i => {
    const tag = i.link ? 'a' : 'div';
    return `<${tag} class="ind"${i.link ? ` href="${esc(i.link)}" target="_blank" rel="noopener"` : ''}><span class="dot ${i.signal ? sigDir(i.signal) : ''}"></span>
      <span class="nm">${esc(i.name)}</span><span class="vl num">${esc(i.value)}</span>${i.link ? '<span class="chev">↗</span>' : ''}</${tag}>`;
  }).join('');
}

function coinDetail(c) {
  return `<div class="d-head"><div class="tk">${esc(c.symbol)}</div><div class="nm">${esc(c.id)}</div></div>
    <div class="d-price num">${fCoin(c.price)}</div>
    <div class="d-chg num ${dir(c.change_24h)}">${fPct(c.change_24h)} <span style="color:var(--muted);font-weight:500">24h</span></div>
    ${chartBlock(c.history, c.dates, fCoin, t('30 days'))}
    <div class="card pad" style="margin-top:12px">
      <div class="kv"><span class="k">${t('Market Cap')}</span><span class="v num">${fCap(c.market_cap)}</span></div>
      <div class="kv"><span class="k">7D</span><span class="v num ${dir(c.change_7d)}">${fPct(c.change_7d)}</span></div></div>
    <div class="ext"><a href="https://www.coingecko.com/en/coins/${encodeURIComponent(c.id)}" target="_blank" rel="noopener">CoinGecko ↗</a></div>`;
}

// ---- Buzz ----
function renderBuzz() {
  const counts = {};
  DATA.reddit.forEach(s => arr(s.ticker_mentions).forEach(m => { counts[m.ticker] = (counts[m.ticker] || 0) + m.count; }));
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 16);
  document.getElementById('mentions').innerHTML = top.map(([tk, c]) =>
    `<span class="chip${STOCKS.has(tk) ? ' tap" data-stock="' + esc(tk) : ''}">${esc(tk)}<small>${c}</small></span>`).join('') || `<span class="subtitle">—</span>`;
  document.getElementById('subs').innerHTML = DATA.reddit.map(sub => `
    <div class="section-h"><h2>r/${esc(sub.subreddit)}</h2></div>
    <div class="card">${arr(sub.posts).map(p => `<a class="post" href="${esc(p.url || '#')}" target="_blank" rel="noopener">
      <div class="pt">${esc(p.title)}</div>
      <div class="pm num"><span class="${p.score > 200 ? 'up' : ''}">▲ ${p.score}</span> · ${p.comments} ${t('comments')}${p.flair && p.flair !== 'nan' ? `<span class="flair">${esc(p.flair)}</span>` : ''}</div></a>`).join('')}</div>`).join('');
}

// ---- Report ----
let reportDate = null;
const SIZES = ['15px', '17px', '19px', '21px'];
let sizeIdx = Math.max(0, SIZES.indexOf(localStorage.getItem('findata_rfs') || '17px'));
document.documentElement.style.setProperty('--rfs', SIZES[sizeIdx]);

async function fetchReport(date, lang) {
  const key = `${date}_${lang}`;
  if (!(key in reportCache)) {
    reportCache[key] = fetch(`predictions/${date}/${date}_prediction_${lang === 'cn' ? 'cn' : 'en'}.md`)
      .then(r => r.ok ? r.text() : null).catch(() => null);
  }
  return reportCache[key];
}

function renderReportPicker() {
  const sel = document.getElementById('rDate');
  sel.innerHTML = DATA.reports.map(r => `<option value="${esc(r.date)}">${esc(r.date)}</option>`).join('');
  if (!reportDate || !DATA.reports.some(r => r.date === reportDate)) reportDate = DATA.reports[0]?.date || null;
  if (reportDate) sel.value = reportDate;
}

function prettyDate(d) {
  const dt = new Date(d + 'T12:00:00');
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString(LANG === 'cn' ? 'zh-CN' : 'en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

async function loadReport() {
  const body = document.getElementById('reportBody');
  const idx = DATA.reports.findIndex(r => r.date === reportDate);
  document.getElementById('rOlder').disabled = idx < 0 || idx >= DATA.reports.length - 1;
  document.getElementById('rNewer').disabled = idx <= 0;
  document.getElementById('rDateLabel').textContent = reportDate ? prettyDate(reportDate) : '—';
  if (!reportDate) { body.innerHTML = `<div class="empty">${t('Report not available')}</div>`; return; }
  const want = reportDate;
  const md = await fetchReport(want, LANG);
  if (want !== reportDate) return;
  if (!md || typeof marked === 'undefined') { body.innerHTML = `<div class="empty">${t('Report not available')}</div>`; return; }
  body.innerHTML = marked.parse(md);
  decorateReport(body);
  // Warm the neighbours so swiping through days is instant
  [idx - 1, idx + 1].forEach(i => DATA.reports[i] && fetchReport(DATA.reports[i].date, LANG));
}

/** Make the generated markdown phone-friendly: scrollable tables, colored numbers, signal badges. */
function decorateReport(root) {
  root.querySelectorAll('code').forEach(c => { if (c.textContent.trim() === 'nan') c.remove(); });
  let hinted = false;
  root.querySelectorAll('table').forEach(tbl => {
    const wrap = document.createElement('div');
    wrap.className = 'tbl-wrap';
    tbl.replaceWith(wrap);
    wrap.appendChild(tbl);
    const heads = [...tbl.querySelectorAll('th')].map(th => th.textContent);
    const changeCol = heads.map(h => /%|Chg|涨跌/.test(h) && !/Vol|波动/.test(h));
    tbl.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => {
      const b = td.querySelector('strong');
      const txt = td.textContent.trim();
      if (b && b.textContent.trim() === txt) td.innerHTML = sigBadge(txt);
      else if (/^(Bullish|Bearish|Neutral|Lean \w+|看涨|看跌|中性|偏多|偏空)$/.test(txt)) td.innerHTML = sigBadge(txt);
      else if (changeCol[i]) { const n = parseFloat(txt.replace(/[^0-9.+-]/g, '')); if (ok(n) && n) td.classList.add(n > 0 ? 'num-up' : 'num-down'); }
      td.classList.add('num');
    }));
    if (!hinted && tbl.scrollWidth > wrap.clientWidth + 4) {
      wrap.insertAdjacentHTML('beforebegin', `<div class="tbl-hint">${t('Swipe tables sideways')} →</div>`);
      hinted = true;
    }
  });
  // "**Overall Market Signal: Bearish**" -> colored
  root.querySelectorAll('p > strong:only-child').forEach(s => {
    if (s.parentNode.textContent.trim() !== s.textContent.trim()) return;
    const m = s.textContent.match(/[:：]\s*(.+)$/);
    if (m) s.innerHTML = `${esc(s.textContent.slice(0, m.index + 1))} <span class="${sigDir(m[1])}">${esc(m[1])}</span>`;
  });
}

function stepReport(delta) {
  const idx = DATA.reports.findIndex(r => r.date === reportDate);
  const next = DATA.reports[idx + delta];
  if (next) go('report', next.date);
}

// ---- Sheet ----
const sheet = document.getElementById('sheet'), sheetBg = document.getElementById('sheetBg');
let sheetOpen = false;
let sheetPushed = false;  // opened by an in-app tap (so Back closes it) vs. a deep link
function openSheet(html) {
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('sheetBody').scrollTop = 0;
  sheet.classList.add('open'); sheetBg.classList.add('open'); sheetOpen = true;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => requestAnimationFrame(attachChart));
}
function closeSheet() {
  sheet.classList.remove('open'); sheetBg.classList.remove('open'); sheetOpen = false;
  sheet.style.transform = '';
  document.body.style.overflow = '';
}
function dismissSheet() {
  if (!/^#(stock|coin)\//.test(location.hash)) closeSheet();
  else if (sheetPushed) history.back();
  else location.replace('#' + current);
  sheetPushed = false;
}
sheetBg.addEventListener('click', dismissSheet);
document.getElementById('sheetClose').addEventListener('click', dismissSheet);
// Drag the handle down to dismiss
(() => {
  const grab = document.getElementById('grab');
  let y0 = null;
  grab.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; sheet.style.transition = 'none'; }, { passive: true });
  grab.addEventListener('touchmove', e => { if (y0 == null) return; const dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = `translateY(${dy}px)`; }, { passive: true });
  grab.addEventListener('touchend', e => {
    sheet.style.transition = '';
    const dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (dy > 90) dismissSheet(); else sheet.style.transform = '';
  });
})();

// ---- Routing: #today, #report/2026-10-30, #stocks, #stock/NVDA, #crypto, #coin/bitcoin, #buzz ----
const TABS = ['today', 'report', 'stocks', 'crypto', 'buzz'];
const TAB_TITLES = { today: 'Today', report: 'Daily Report', stocks: 'Stocks', crypto: 'Crypto', buzz: 'Reddit Buzz' };
const ALIASES = { markets: 'today', sentiment: 'buzz', semi: 'stocks', ranking: 'stocks' };  // desktop hashes
let current = null;  // set by the first route()
const scrollPos = {};

function go(page, param) {
  const h = '#' + page + (param ? '/' + param : '');
  if (location.hash !== h) location.hash = h; else route();
}

function route() {
  const [raw, ...rest] = location.hash.slice(1).split('/');
  const param = decodeURIComponent(rest.join('/'));
  let page = ALIASES[raw] || raw;
  if (page === 'stock' || page === 'coin') {
    if (!DATA) return;
    const item = page === 'stock' ? STOCKS.get(param.toUpperCase()) : DATA.crypto.find(c => c.id === param);
    if (item) openSheet(page === 'stock' ? stockDetail(item) : coinDetail(item));
    else closeSheet();
    return;
  }
  if (sheetOpen) closeSheet();
  if (raw === 'stocks' && param) { location.replace('#stock/' + param); return; }  // desktop #stocks/NVDA
  if (!TABS.includes(page)) page = 'today';
  if (page !== current) {
    if (current) scrollPos[current] = scrollY;
    current = page;
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + page));
    document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === page));
    scrollTo(0, scrollPos[page] || 0);
  }
  document.getElementById('ctitle').textContent = t(TAB_TITLES[page]);
  if (page === 'report' && DATA) {
    const want = param || reportDate || DATA.reports[0]?.date;
    if (want !== reportDate || !document.getElementById('reportBody').innerHTML) {
      reportDate = want;
      document.getElementById('rDate').value = want;
      loadReport();
      if (param) scrollTo(0, 0);
    }
  }
  updateTopbar();
}
window.addEventListener('hashchange', route);

// ---- Events ----
document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  if (b.dataset.tab === current) scrollTo({ top: 0, behavior: 'smooth' });  // tap active tab = scroll to top, like iOS
  else go(b.dataset.tab, b.dataset.tab === 'report' ? reportDate : '');
});
document.addEventListener('click', e => {
  const s = e.target.closest('[data-stock]');
  if (s) { sheetPushed = true; go('stock', s.dataset.stock); return; }
  const c = e.target.closest('[data-coin]');
  if (c) { sheetPushed = true; go('coin', c.dataset.coin); return; }
  if (e.target.id === 'more') { listLimit += 60; renderStocks(); }
});
document.getElementById('q').addEventListener('input', () => { listLimit = 40; renderStocks(); });
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
document.getElementById('sortSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  sortMode = b.dataset.s; listLimit = 40;
  document.querySelectorAll('#sortSeg button').forEach(x => x.classList.toggle('on', x === b));
  renderStocks();
});
document.getElementById('rDate').addEventListener('change', e => go('report', e.target.value));
document.getElementById('rOlder').addEventListener('click', () => stepReport(1));
document.getElementById('rNewer').addEventListener('click', () => stepReport(-1));
document.getElementById('rSize').addEventListener('click', () => {
  sizeIdx = (sizeIdx + 1) % SIZES.length;
  document.documentElement.style.setProperty('--rfs', SIZES[sizeIdx]);
  localStorage.setItem('findata_rfs', SIZES[sizeIdx]);
});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'cn' ? 'en' : 'cn';
  localStorage.setItem('findata_lang', LANG);
  if (DATA) renderAll(); else applyStatic();
});
document.getElementById('refreshBtn').addEventListener('click', () => { reportCache = {}; loadData(); });
document.getElementById('desktopLink').addEventListener('click', () => sessionStorage.setItem('findata_desktop', '1'));

function updateTopbar() {
  const lt = document.querySelector('.view.active .large-title');
  const bar = document.getElementById('topbar');
  bar.classList.toggle('scrolled', !!lt && lt.getBoundingClientRect().bottom < bar.getBoundingClientRect().bottom);
}
addEventListener('scroll', updateTopbar, { passive: true });

// Home-screen apps stay resident for days; refetch when brought back after a while
let loadedAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - loadedAt > 10 * 60 * 1000) { reportCache = {}; loadData(); }
});

applyStatic();
route();
loadData().then(route);
</script>
